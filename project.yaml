# CCGS project configuration — single source of truth for project settings.
# See .claude/docs/effects-map.md for full schema.

schema_version: 1

framework:
  version: 1.2.0
  last_upgraded: 2026-10-19

# NOTE: this template ships with no `modes:` block, and the six knobs below must
# never be added to one.
#
# `/start` DOES add `modes.rigor` and `modes.automation` here — that is its job,
# and a `modes:` block containing those two is the expected state of a configured
# project, not a mistake.
#
# What must stay absent is the six knobs `modes.rigor` FRONTS:
# `modes.review_mode`, `modes.workflow`, `docs.density`, `qa.level`,
# `modes.story_granularity` and `team.size`. Seeding any of them in this file
# pins that value and shadows the rigor expansion, so the rigor `/start` infers
# and saves would stop changing anything. `/start` states the same rule for the
# settings it writes.
#
# Per-developer preferences belong in `project.local.yaml` (gitignored), not
# here. `/settings --local <key>=<value>` writes there; `/settings <key>=<value>`
# edits this file. See `.claude/docs/config-resolution.md` for the full
# precedence order.

# Harness capabilities (.claude/docs/agent-harness.md, effects-map.md § harness).
# Shipped unset on purpose: an unset key reports NOT CONFIGURED, never a pass.
# Fill each with the command or path your engine uses, from
# docs/engine-reference/<engine>/, never from memory. Uncomment to set.
#
# harness:
#   rng_seed:        # how a run gets its seed                        (H1)
#   state_save:      # write the simulation state to a file           (H2)
#   state_load:      # start a run from a state file                  (H2)
#   command_replay:  # run a command script against a build           (H3)
#   data_reload:     # reload tuning data without a rebuild           (H4)
#   sim_test:        # simulation tests without the renderer          (H5)
#   capture:         # capture a state to an image, layer toggles     (H7)
#   image_diff:      # compare two images, print a similarity number  (H7)
#   profile_text:    # export a profile as text                       (H8)

# Unity asset loading (.claude/docs/unity-folder-structure.md, effects-map.md section unity.asset_loading).
# Unset on purpose: /setup-engine asks. Assets/Resources/ exists only for `resources`.
#
# unity:
#   asset_loading:   # addressables | resources | direct
#   project_root:    # folder of the Unity project below the repo root, e.g. MyGame when
#                    # the layout is <repo>/MyGame/Assets. Unset: Assets/ is at the repo root
